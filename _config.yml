# Site build for GitHub Pages. The same Markdown files read as written on
# GitHub; this only controls how Pages renders them.
repository: norman-abramovitz/cf-docs-rfc-proposal
branch: main
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM

# Code samples in these documents use Markdoc, Jinja and Hugo syntax that
# looks like Liquid; render every page as written.
defaults:
  - scope:
      path: ""
    values:
      render_with_liquid: false

# Tool input trees are source files for other generators, not pages of this
# site. Links into them go to the GitHub file view (_plugins/github_links.rb).
exclude:
  - concepts/tables/sites
  - concepts/tables/probes
  - concepts/tables/checks
  - concepts/tables/source
  - concepts/tables/survey/*.csv
  - concepts/tables/survey/*.py
  - concepts/tables/survey/*.txt
  - concepts/headings/sites
  - concepts/headings/checks
  - concepts/headings/source
  - concepts/headings/published
  - concepts/headings/survey/*.csv
  - concepts/headings/survey/*.py
  - concepts/notes/sites
  - concepts/notes/checks
  - concepts/notes/source
  - concepts/notes/published
  - concepts/notes/survey/*.csv
  - concepts/notes/survey/*.py
  - concepts/notes/survey/*.txt
  - concepts/variables/sites
  - concepts/variables/checks
  - concepts/variables/source
  - concepts/variables/published
  - concepts/variables/survey/*.csv
  - concepts/variables/survey/*.py
  - concepts/variables/survey/*.txt
  - concepts/partials/sites
  - concepts/partials/checks
  - concepts/partials/source
  - concepts/partials/published
  - concepts/partials/survey/*.csv
  - concepts/partials/survey/*.py
  - concepts/partials/survey/*.txt
  - concepts/build-time-values/sites
  - concepts/build-time-values/checks
  - concepts/build-time-values/helpers
  - concepts/build-time-values/source
  - concepts/build-time-values/published
  - concepts/build-time-values/survey/*.csv
  - concepts/build-time-values/survey/*.py
  - concepts/build-time-values/survey/*.txt
  - concepts/cross-repo-links/sites
  - concepts/cross-repo-links/checks
  - concepts/cross-repo-links/source
  - concepts/cross-repo-links/published
  - concepts/cross-repo-links/survey/*.csv
  - concepts/cross-repo-links/survey/*.py
  - concepts/cross-repo-links/survey/*.txt
  - Gemfile
  - Gemfile.lock
  - vendor
