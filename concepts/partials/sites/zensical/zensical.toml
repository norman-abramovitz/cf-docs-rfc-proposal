# The notes round's site. Partials are included from partials/: one
# folder per mode, and shared/, which stands for a checkout of another
# content source.
[project]
site_name = "Partials round — Zensical"
docs_dir = "docs"
site_dir = "site"

# Defaults from a new project, plus `tables` for pipe tables.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Snippets (the snippet mode): the native partials and the shared folder;
# a snippet that is not found fails the build.
pymdownx.snippets = { base_path = ["partials/native", "partials/shared"], check_paths = true }
pymdownx.superfences = {}
pymdownx.tilde = {}

# Variables keep their ERB form: <%= vars.name %>.
[project.plugins.macros]
include_yaml = ["vars.yml"]
include_dir = "partials"
on_undefined = "silent"
on_error_fail = true
j2_variable_start_string = "<%="
j2_variable_end_string = "%>"
j2_block_start_string = "<%"
j2_block_end_string = "%>"
j2_comment_start_string = "<%#"
j2_comment_end_string = "%>"
