# Antora playbook for the partials round: the notes round's playbook with
# the partials round's components. `make build` adds the variables from
# source/template_variables.yml as AsciiDoc attributes (playbook.js) and
# builds from site-playbook.yml.
site:
  title: Partials round — Antora
  start_page: ROOT::index.adoc
content:
  sources:
  # This repository, read from its worktree, so pages need not be committed
  - url: ./../../../..
    branches: HEAD
    start_paths:
    - concepts/partials/sites/antora/home
    - concepts/partials/sites/antora/passthrough
    - concepts/partials/sites/antora/native
    - concepts/partials/sites/antora/variable
    - concepts/partials/sites/antora/raw
    - concepts/partials/sites/antora/probe
    - concepts/partials/sites/antora/shared
ui:
  bundle:
    # The default UI, pinned: `make` downloads one build and checks its hash
    url: ./.cache/ui-bundle.zip
urls:
  html_extension_style: indexify
asciidoc:
  attributes:
    # An undefined attribute renders as nothing, as an undefined ERB variable does
    attribute-missing: drop
    # A heading without an id gets one with no prefix and words joined by
    # hyphens (about-metadata), as on the published page and in the other
    # tools; Asciidoctor's default is _about_metadata
    idprefix: ''
    idseparator: '-'
output:
  dir: ./site
runtime:
  cache_dir: ./.cache/antora
  fetch: false
