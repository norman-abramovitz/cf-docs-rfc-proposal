# Passthrough: the earlier rounds' site. Variables keep their ERB form,
# <%= vars.name %>, read by the built-in macros extension with ERB
# delimiters; vars.yml is the book's variables file with its top key
# renamed. A name that is not defined renders as nothing, as in the book.
[project]
site_name = "Variables round — Zensical"
docs_dir = "docs/passthrough"
site_dir = "site/passthrough"

# Defaults from a new project, plus `tables` for pipe tables.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tilde = {}

[project.plugins.macros]
include_yaml = ["vars.yml"]
on_undefined = "silent"
on_error_fail = true
j2_variable_start_string = "<%="
j2_variable_end_string = "%>"
j2_block_start_string = "<%"
j2_block_end_string = "%>"
j2_comment_start_string = "<%#"
j2_comment_end_string = "%>"
