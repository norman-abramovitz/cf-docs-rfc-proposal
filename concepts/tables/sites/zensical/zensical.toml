[project]
site_name = "Tables round — Zensical"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/hints.css"]

# Defaults from a new project, plus `tables` for pipe tables.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tilde = {}
# The list-table block for extension mode (list_table.py, next to this file)
list_table = {}

# Variables keep their ERB form: <%= vars.name %>. Partials live outside
# docs/ so they never become pages; a host page includes one with
# <% include "<mode>/_name.md" %>.
[project.plugins.macros]
include_yaml = ["vars.yml"]
include_dir = "partials"
on_undefined = "silent"
on_error_fail = true
j2_variable_start_string = "<%="
j2_variable_end_string = "%>"
j2_block_start_string = "<%"
j2_block_end_string = "%>"
j2_comment_start_string = "<%#"
j2_comment_end_string = "%>"
